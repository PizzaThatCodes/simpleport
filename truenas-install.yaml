services:
  simpleport:
    image: ghcr.io/PizzaThatCodes/simpleport:latest
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "8546"
      UI_USERNAME: admin
      UI_PASSWORD: change-this-password
      SESSION_SECRET: replace-with-a-long-random-secret
      SESSION_COOKIE_SECURE: "false"
      SIMPLEPORT_DATA_DIR: /data
      MINIUPNPC_COMMAND: upnpc
    volumes:
      - type: ix_volume
        ix_volume_config:
          dataset_name: simpleport-data
        target: /data